<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" width="240" height="360">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="canopyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="funnelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="sleeveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f8fafc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="trapShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background: Farm Field & Sky -->
  <rect width="240" height="360" rx="16" fill="url(#skyGrad)"/>
  <ellipse cx="120" cy="330" rx="90" ry="16" fill="#15803d" opacity="0.3"/>
  <path d="M0 270 Q60 250 120 270 T240 270 V360 H0 Z" fill="#22c55e" opacity="0.4"/>
  <path d="M0 290 Q60 275 120 295 T240 285 V360 H0 Z" fill="#16a34a" opacity="0.6"/>

  <!-- Support Pole (Bamboo Stake) -->
  <rect x="116" y="20" width="8" height="320" rx="3" fill="#a16207"/>
  <line x1="116" y1="80" x2="124" y2="80" stroke="#78350f" stroke-width="2"/>
  <line x1="116" y1="160" x2="124" y2="160" stroke="#78350f" stroke-width="2"/>
  <line x1="116" y1="240" x2="124" y2="240" stroke="#78350f" stroke-width="2"/>

  <!-- Trap Assembly Group with Drop Shadow -->
  <g filter="url(#trapShadow)">
    <!-- Hanging Wire / String -->
    <path d="M120 40 L120 64" stroke="#475569" stroke-width="2"/>

    <!-- Top Canopy (Chhatri / Hood) -->
    <path d="M60 90 Q120 54 180 90 L174 96 Q120 64 66 96 Z" fill="url(#canopyGrad)" stroke="#a16207" stroke-width="1.2"/>
    <ellipse cx="120" cy="94" rx="55" ry="8" fill="#ca8a04" opacity="0.5"/>

    <!-- Pheromone Lure Basket (Disperser inside hood) -->
    <rect x="113" y="80" width="14" height="20" rx="3" fill="#dc2626" stroke="#991b1b" stroke-width="1"/>
    <circle cx="120" cy="88" r="2.5" fill="#fef2f2"/>
    <text x="120" y="98" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="5" font-weight="900">LURE</text>

    <!-- Funnel Collar (Yellow Funnel) -->
    <polygon points="76,116 164,116 142,160 98,160" fill="url(#funnelGrad)" stroke="#a16207" stroke-width="1.2"/>
    <ellipse cx="120" cy="116" rx="44" ry="7" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
    <ellipse cx="120" cy="160" rx="22" ry="4" fill="#a16207"/>

    <!-- Lower Sleeve / Polythene Bag (Pouch where moths collect) -->
    <path d="M98 160 Q86 210 92 268 Q120 282 148 268 Q154 210 142 160 Z" fill="url(#sleeveGrad)" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Sleeve Bottom Ring / Tie -->
    <rect x="110" y="270" width="20" height="5" rx="2" fill="#ca8a04"/>

    <!-- Moths trapped inside illustration -->
    <g opacity="0.75">
      <ellipse cx="114" cy="235" rx="4" ry="2.5" fill="#475569" transform="rotate(-15 114 235)"/>
      <ellipse cx="126" cy="245" rx="4" ry="2.5" fill="#334155" transform="rotate(25 126 245)"/>
      <ellipse cx="118" cy="255" rx="3.5" ry="2" fill="#475569" transform="rotate(5 118 255)"/>
      <ellipse cx="130" cy="230" rx="3" ry="2" fill="#64748b" transform="rotate(-30 130 230)"/>
    </g>
  </g>

  <!-- Pheromone Scent Wave Indicator -->
  <path d="M136 78 C144 74 150 78 156 74" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.7"/>
  <path d="M138 84 C148 80 154 84 162 80" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.7"/>

  <!-- Badge at bottom: IPM Funnel Trap -->
  <rect x="24" y="300" width="192" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="120" y="318" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="0.3">फेरोमोन फनल ट्रैप</text>
  <text x="120" y="333" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="9" font-weight="800">PHEROMONE TRAP</text>
</svg>
