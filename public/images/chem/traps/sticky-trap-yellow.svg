<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" width="240" height="360">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="360" rx="16" fill="url(#skyGrad)"/>
  <ellipse cx="120" cy="330" rx="90" ry="16" fill="#15803d" opacity="0.3"/>
  <path d="M0 270 Q60 250 120 270 T240 270 V360 H0 Z" fill="#22c55e" opacity="0.4"/>
  <path d="M0 290 Q60 275 120 295 T240 285 V360 H0 Z" fill="#16a34a" opacity="0.6"/>

  <!-- Bamboo Support Stake -->
  <rect x="116" y="24" width="8" height="310" rx="3" fill="#a16207"/>

  <!-- Yellow Sticky Card -->
  <g filter="url(#cardShadow)">
    <rect x="65" y="70" width="110" height="170" rx="6" fill="#facc15" stroke="#eab308" stroke-width="2"/>
    <!-- Hole at top with wire tie -->
    <circle cx="120" cy="80" r="3.5" fill="#a16207"/>
    <path d="M120 76 Q120 56 120 50" stroke="#475569" stroke-width="2"/>

    <!-- Grid / Adhesive Lines -->
    <line x1="65" y1="110" x2="175" y2="110" stroke="#eab308" stroke-width="0.75" stroke-dasharray="3,3"/>
    <line x1="65" y1="150" x2="175" y2="150" stroke="#eab308" stroke-width="0.75" stroke-dasharray="3,3"/>
    <line x1="65" y1="190" x2="175" y2="190" stroke="#eab308" stroke-width="0.75" stroke-dasharray="3,3"/>
    <line x1="102" y1="70" x2="102" y2="240" stroke="#eab308" stroke-width="0.75" stroke-dasharray="3,3"/>
    <line x1="138" y1="70" x2="138" y2="240" stroke="#eab308" stroke-width="0.75" stroke-dasharray="3,3"/>

    <!-- Stuck Insects (Whitefly, Aphids) -->
    <circle cx="85" cy="100" r="2" fill="#1e293b"/>
    <circle cx="95" cy="130" r="1.5" fill="#334155"/>
    <circle cx="145" cy="115" r="2" fill="#1e293b"/>
    <circle cx="130" cy="165" r="1.5" fill="#334155"/>
    <circle cx="90" cy="180" r="2" fill="#1e293b"/>
    <circle cx="155" cy="190" r="1.5" fill="#334155"/>
    <circle cx="115" cy="210" r="2" fill="#1e293b"/>
  </g>

  <!-- Bottom Badge -->
  <rect x="24" y="295" width="192" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="120" y="315" text-anchor="middle" fill="#ca8a04" font-family="Arial, sans-serif" font-size="11" font-weight="900">पीला चिपचिपा ट्रैप</text>
  <text x="120" y="330" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="8.5" font-weight="800">YELLOW STICKY TRAP</text>
</svg>
